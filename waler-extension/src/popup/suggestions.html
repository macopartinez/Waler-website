<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Waler - Classification Suggestions</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 400px;
      min-height: 500px;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: hsl(240, 10%, 3.9%);
      color: hsl(0, 0%, 98%);
    }

    .container {
      padding: 20px;
    }

    .header {
      text-align: center;
      margin-bottom: 24px;
    }

    .header {
      padding-bottom: 16px;
      border-bottom: 1px solid hsl(240, 3.7%, 15.9%);
    }

    .logo {
      font-family: 'Outfit', sans-serif;
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 6px;
      color: hsl(142, 70%, 50.4%);
    }

    .subtitle {
      font-size: 13px;
      color: hsl(240, 5%, 64.9%);
      font-weight: 500;
    }

    .suggestions-count {
      background: hsl(142, 70%, 50.4%, 0.1);
      border: 1px solid hsl(142, 70%, 50.4%, 0.25);
      border-radius: 12px;
      padding: 12px;
      text-align: center;
      margin-bottom: 20px;
      font-size: 14px;
      color: hsl(142, 70%, 60%);
      font-weight: 600;
    }

    .suggestions-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-height: 400px;
      overflow-y: auto;
      padding-right: 8px;
    }

    .suggestion-card {
      background: hsl(240, 3.7%, 12%);
      border: 1px solid hsl(240, 3.7%, 18%);
      border-radius: 12px;
      padding: 16px;
      transition: all 0.2s;
    }

    .suggestion-card:hover {
      border-color: hsl(142, 70%, 50.4%, 0.35);
      transform: translateY(-2px);
    }

    .suggestion-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .username {
      font-size: 16px;
      font-weight: 600;
    }

    .transition {
      font-size: 14px;
      opacity: 0.9;
      margin-bottom: 8px;
    }

    .transition-arrow {
      margin: 0 8px;
    }

    .score-badge {
      background: hsl(142, 70%, 50.4%, 0.15);
      color: hsl(142, 70%, 60%);
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 700;
    }

    .reason {
      font-size: 13px;
      opacity: 0.85;
      margin-bottom: 8px;
      font-style: italic;
    }

    .evidence {
      font-size: 12px;
      opacity: 0.75;
      margin-bottom: 12px;
    }

    .evidence-item {
      margin-left: 16px;
      margin-top: 4px;
    }

    .actions {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    .btn {
      flex: 1;
      background: hsl(240, 3.7%, 18%);
      border: 1px solid hsl(240, 3.7%, 24%);
      border-radius: 8px;
      padding: 10px;
      color: hsl(0, 0%, 98%);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
    }

    .btn:hover {
      border-color: hsl(240, 3.7%, 32%);
      transform: translateY(-1px);
    }

    .btn-accept {
      background: hsl(142, 70%, 50.4%);
      border-color: hsl(142, 70%, 50.4%);
      color: hsl(240, 10%, 3.9%);
      font-weight: 700;
    }

    .btn-accept:hover {
      background: hsl(142, 70%, 55%);
      border-color: hsl(142, 70%, 55%);
      box-shadow: 0 0 18px hsl(142, 70%, 50.4%, 0.35);
    }

    .btn-reject {
      background: transparent;
      border-color: hsl(0, 70%, 50.4%, 0.4);
      color: hsl(0, 70%, 65%);
    }

    .btn-reject:hover {
      border-color: hsl(0, 70%, 55%);
      background: hsl(0, 70%, 50.4%, 0.1);
    }

    .btn-view {
      background: transparent;
      border-color: hsl(240, 3.7%, 28%);
    }

    .btn-view:hover {
      border-color: hsl(142, 70%, 50.4%, 0.4);
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
    }

    .empty-icon {
      font-size: 64px;
      margin-bottom: 16px;
      opacity: 0.5;
    }

    .empty-text {
      font-size: 16px;
      opacity: 0.8;
    }

    .loading {
      text-align: center;
      padding: 40px;
    }

    .spinner {
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-top: 3px solid #fff;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 0 auto 16px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .category-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
    }

    .category-lead {
      background: rgba(158, 158, 158, 0.3);
    }

    .category-prospect {
      background: rgba(33, 150, 243, 0.3);
    }

    .category-client {
      background: rgba(76, 175, 80, 0.3);
    }

    .category-network {
      background: rgba(255, 152, 0, 0.3);
    }

    .back-button {
      background: rgba(255, 255, 255, 0.2);
      border: none;
      border-radius: 8px;
      padding: 8px 16px;
      color: #fff;
      font-size: 13px;
      cursor: pointer;
      margin-bottom: 16px;
    }

    .back-button:hover {
      background: rgba(255, 255, 255, 0.3);
    }

    ::-webkit-scrollbar {
      width: 6px;
    }

    ::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 3px;
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.3);
      border-radius: 3px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.5);
    }
  </style>
</head>
<body>
  <div class="container">
    <button class="back-button" id="back-btn" data-i18n="suggestions.back">← Back</button>

    <div class="header">
      <div class="logo">💡 Suggestions</div>
      <div class="subtitle" data-i18n="suggestions.subtitle">Automatic classifications</div>
    </div>

    <div id="loading" class="loading">
      <div class="spinner"></div>
      <div data-i18n="common.loading">Loading...</div>
    </div>

    <div id="content" style="display: none;">
      <div class="suggestions-count" id="count">
        <span id="count-text">0 suggestion pending</span>
      </div>

      <div class="suggestions-list" id="suggestions-list">
        <!-- Suggestions will be inserted here -->
      </div>

      <div id="empty-state" class="empty-state" style="display: none;">
        <div class="empty-icon">✨</div>
        <div class="empty-text" data-i18n="suggestions.empty">No suggestions yet</div>
      </div>
    </div>
  </div>

  <script type="module" src="suggestions.js"></script>
</body>
</html>
